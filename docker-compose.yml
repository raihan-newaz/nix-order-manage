services:
  # 1. NIX OMS Backend API
  nix-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nix-oms-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    # MariaDB is bound to the VPS loopback. Host networking lets this
    # container reach it at 127.0.0.1 while API_HOST keeps the API private.
    network_mode: host
    environment:
      PORT: "5000"
      API_HOST: 127.0.0.1

  # 2. Admin Dashboard Client (my.nix.bd)
  nix-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: nix-oms-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3007:80"
    networks:
      - nix-network

  # 3. Customer Storefront (nix.bd)
  nix-storefront:
    build:
      context: .
      dockerfile: storefront/Dockerfile
    container_name: nix-oms-storefront
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:80"
    networks:
      - nix-network

networks:
  nix-network:
    driver: bridge
